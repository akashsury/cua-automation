[project]
name = "cua-automation"
version = "0.1.0"
description = "Computer-use discovery -> capability artifact -> deterministic replay, with guardrails and human handoff"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.51",
  "anthropic>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cua = "cua.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cua*", "mockbank*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
