schema_version: '1.0'
id: mockcore.lookup_member_balance
version: 1.0.0
status: approved
title: Look up member {{param.member_id}} and read their current savings balance
description: Look up member {{param.member_id}} and read their current savings balance
app:
  vendor: MockCore
  product: Member Services
  version_range: '>=3.0 <4.0'
  surface: legacy_web
entry_url: /
requires:
- mockcore.sign_on
risk: read_only
inputs:
  member_id:
    type: string
    description: numeric identifier (5 digits; inferred from the discovery example — review)
    pattern: ^\d{5}$
    sensitive: false
secrets: {}
outputs:
  savings_balance:
    type: decimal
    description: Read savings balance from the SAVINGS row.
    sensitive: false
steps:
- id: fill_member_number
  action: fill
  description: Enter member number to look up.
  target:
  - by: row_label
    label: 'Member Number:'
    control: input
    frame: workarea
  - by: css
    selector: input[name="f1"]
    frame: workarea
  - by: css
    selector: body:nth-of-type(1) > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1)
      > td:nth-of-type(2) > input:nth-of-type(1)
    frame: workarea
  value: '{{param.member_id}}'
  risk: safe
  source: agent
  timeout_ms: 10000
  why: '#1 row_label: legacy form: no accessible name, anchored on the visible label in the same table row | #2
    css: form field name attribute: stable within a product version, opaque to humans | #3 css: structural path:
    last resort, breaks on any layout change'
- id: click_inquire
  action: click
  description: Submit the member inquiry.
  target:
  - by: role
    role: button
    name: Inquire
    frame: workarea
  - by: css
    selector: input[type="submit"][value="Inquire"]
    frame: workarea
  - by: css
    selector: body:nth-of-type(1) > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(2)
      > td:nth-of-type(2) > input:nth-of-type(1)
    frame: workarea
  expect:
    all_of:
    - type: url_matches
      pattern: ^/app/member/{{param.member_id}}$
      frame: workarea
    - type: title_is
      title: MEMBER DETAIL
      frame: workarea
  risk: safe
  source: agent
  timeout_ms: 10000
  why: '#1 role: accessible role+name: survives layout/markup changes; maps to desktop a11y APIs | #2 css: submit
    value | #3 css: structural path: last resort, breaks on any layout change'
- id: extract_savings_balance
  action: extract
  description: Read savings balance from the SAVINGS row.
  target:
  - by: table_cell
    column: BALANCE
    row_match: SAVINGS
    frame: workarea
  output: savings_balance
  risk: safe
  source: agent
  timeout_ms: 10000
  why: 'read by table column header + row text (or adjacent label): independent of row order and cell position'
checkpoint:
  all_of:
  - type: text_visible
    text: MEMBER DETAIL
    match: contains
    frame: workarea
  - type: title_is
    title: MEMBER DETAIL
    frame: workarea
  - type: url_matches
    pattern: ^/app/member/{{param.member_id}}$
    frame: workarea
known_conditions:
- code: MEMBER_NOT_FOUND
  kind: business_outcome
  detect:
    type: text_visible
    text: MBR NOT FOUND
    match: contains
  message: No member exists with that member number.
- code: INVALID_MEMBER_NUMBER
  kind: business_outcome
  detect:
    type: text_visible
    text: INVALID MEMBER NUMBER
    match: contains
  message: The core system rejected the member number format.
- code: INVALID_AMOUNT
  kind: business_outcome
  detect:
    type: text_visible
    text: (INVALID AMOUNT|MINIMUM OPENING DEPOSIT)
    match: regex
  message: The core system rejected the amount.
- code: PERMISSION_DENIED
  kind: business_outcome
  detect:
    type: text_visible
    text: NOT AUTHORIZED FOR THIS FUNCTION
    match: contains
  message: The service account is not entitled to this function in the core system.
- code: SYSTEM_NOTICE
  kind: recoverable
  detect:
    type: title_is
    title: SYSTEM NOTICE
  message: Informational interstitial page.
  recovery:
    action: dismiss
    target:
    - by: role
      role: link
      name: Continue
    - by: text
      text: Continue
    max_attempts: 2
- code: SESSION_EXPIRED
  kind: recoverable
  detect:
    type: text_visible
    text: SESSION EXPIRED
    match: contains
  message: Core session timed out.
  recovery:
    action: relogin_restart
    target: []
    max_attempts: 1
- code: PROCESSING
  kind: recoverable
  detect:
    type: text_visible
    text: PLEASE WAIT
    match: contains
  message: Core is still processing.
  recovery:
    action: wait
    target: []
    max_attempts: 3
- code: CORE_SYSTEM_ERROR
  kind: hard_failure
  detect:
    type: text_visible
    text: SYSTEM ERROR
    match: contains
  message: The core system returned an internal error.
provenance:
  recorded_at: '2026-11-20T22:44:17+00:00'
  discovery_run_id: discovery-20261120-164407-ab85
  model: claude-opus-5-5
  human_steps: 0
  notes: input patterns inferred from a single example
